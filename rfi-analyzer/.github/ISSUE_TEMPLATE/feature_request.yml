name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What are you trying to do that the tool makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like it to do
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        This tool reads documents you already have. It does not submit
        responses or interact with procurement systems.
      options:
        - label: This request does not involve submitting to or scraping a government system
          required: true
